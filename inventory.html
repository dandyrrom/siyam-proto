<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Ledger - Enterprise Schema Architecture</title>
    
    <!-- Typography: Inter & Monospace -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'],
                        mono: ['SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
                    }, 
                    colors: { 
                        brand: {
                            forest: '#1E4D40',
                            forestLight: '#2A6B59',
                            sand: '#F7F5F0',
                            sandDark: '#EADDCD',
                            terracotta: '#D96C5B',
                            slate: '#2C3E50',
                            paper: '#FFFFFF'
                        }
                    },
                    boxShadow: {
                        'ledger': '0 2px 4px rgba(0,0,0,0.02)',
                    }
                } 
            } 
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #EADDCD; border-radius: 4px; }
        #side-drawer { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .drawer-open { transform: translateX(0) !important; }
        .modal-enter { opacity: 1 !important; transform: scale(1) translateY(0) !important; }
        .sticky-header { position: sticky; top: 0; z-index: 10; backdrop-filter: blur(8px); }
    </style>
</head>
<body class="bg-brand-sand text-brand-slate font-sans h-screen flex overflow-hidden">

    <!-- WORKSPACE -->
    <main class="flex-1 flex flex-col min-w-0 relative h-screen overflow-hidden">
                 
        <!-- Unified Constrained Wrapper (Option A) -->
        <div class="flex-1 overflow-hidden flex flex-col w-full">

            <!-- Header flush to sidebar -->
            <header class="h-16 bg-brand-paper border-b border-brand-sandDark flex items-center justify-between px-6 shrink-0 z-20 w-full">
                <div class="flex items-center gap-2">
                    <span class="text-sm font-medium text-gray-500">DAS SIYAM</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
                    <span class="text-sm font-bold text-brand-slate">Inventory</span>
                </div>
                <div class="flex items-center gap-4">
                    <button class="relative w-8 h-8 rounded bg-brand-sand border border-brand-sandDark flex items-center justify-center text-gray-500 hover:text-brand-forest transition">
                        <i data-lucide="bell" class="w-4 h-4"></i>
                    </button>
                </div>
            </header>

            <!-- Inner Content Wrapper (Restores padding and layout) -->
            <div class="flex-1 overflow-hidden flex flex-col p-6">

                <!-- Unified Top Row: Stats & Actions -->
                <div class="flex flex-col md:flex-row items-start md:items-center justify-between w-full mb-4 gap-4 shrink-0">
                    
                    <!-- Quick Stats Summary (Left) -->
                    <div class="flex items-center gap-3 bg-brand-paper p-2 rounded border border-brand-sandDark shadow-ledger">
                        <div class="flex flex-col px-4 border-r border-brand-sandDark">
                            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Total Active</span>
                            <span id="stat-total" class="text-xl font-bold text-brand-slate leading-none mt-0.5 font-mono">--</span>
                        </div>
                        <div class="flex items-center gap-2 px-3">
                            <div class="w-8 h-8 rounded bg-[#FAFAF8] border border-brand-sandDark flex items-center justify-center text-gray-500"><i data-lucide="dog" class="w-4 h-4"></i></div>
                            <span id="stat-dogs" class="text-lg font-bold text-brand-slate font-mono">--</span>
                        </div>
                        <div class="flex items-center gap-2 px-3 pl-1">
                            <div class="w-8 h-8 rounded bg-[#FAFAF8] border border-brand-sandDark flex items-center justify-center text-gray-500"><i data-lucide="cat" class="w-4 h-4"></i></div>
                            <span id="stat-cats" class="text-lg font-bold text-brand-slate font-mono">--</span>
                        </div>
                    </div>

                    <!-- Action Buttons (Right) -->
                    <div class="flex items-center gap-3">
                        <button onclick="openModal('in')" class="flex items-center gap-2 px-4 py-2 bg-white border border-brand-forest text-brand-forest rounded text-sm font-medium hover:bg-brand-sand transition shadow-sm">
                            <i data-lucide="arrow-down-to-line" class="w-4 h-4"></i> Stock In
                        </button>
                        <button onclick="openModal('out')" class="flex items-center gap-2 px-4 py-2 bg-white border border-brand-forest text-brand-forest rounded text-sm font-medium hover:bg-brand-sand transition shadow-sm">
                            <i data-lucide="arrow-up-from-line" class="w-4 h-4"></i> Stock Out
                        </button>
                        <button onclick="openModal('create')" class="flex items-center gap-2 px-4 py-2 bg-brand-forest text-white rounded text-sm font-medium hover:bg-brand-forestLight transition shadow-ledger">
                            <i data-lucide="plus" class="w-4 h-4"></i> Add Item
                        </button>
                    </div>
                    
                </div>
                
                <!-- CONTROLS BAR -->
                <div class="flex items-center gap-3 mb-4 shrink-0 bg-brand-paper p-2.5 rounded border border-brand-sandDark shadow-ledger">
                    <div class="flex bg-brand-sand rounded p-0.5 shrink-0 border border-brand-sandDark">
                        <button id="btn-flat" onclick="toggleView('flat')" class="px-4 py-1.5 text-sm font-bold rounded bg-brand-forestLight/20 text-brand-forest transition-all">Flat List</button>
                        <button id="btn-group" onclick="toggleView('group')" class="px-4 py-1.5 text-sm font-medium rounded text-gray-500 hover:text-brand-forest transition-all">Grouped</button>
                    </div>
                    <div class="w-px h-6 bg-brand-sandDark mx-1"></div>
                    <div class="relative flex-1 min-w-[200px]">
                        <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                        <input type="text" id="search-input" oninput="renderList()" placeholder="Search items, brands, specs..." class="w-full pl-9 pr-3 py-1.5 bg-transparent text-sm focus:outline-none font-medium">
                    </div>
                    <div class="w-px h-6 bg-brand-sandDark mx-1"></div>
                    <div class="flex items-center gap-2 shrink-0">
                        <i data-lucide="filter" class="w-4 h-4 text-gray-400"></i>
                        <select id="filter-category" onchange="renderList()" class="bg-transparent text-sm focus:outline-none text-brand-slate font-medium cursor-pointer py-1.5">
                            <option value="All">All Categories</option>
                            <option value="Medications">Medications</option>
                            <option value="Injectables">Injectables</option>
                            <option value="Topicals">Topicals</option>
                            <option value="Vaccines">Vaccines</option>
                            <option value="Diagnostics">Diagnostics</option>
                            <option value="Consumables">Consumables</option>
                            <option value="Nutrition">Nutrition</option>
                            <option value="Equipment">Equipment</option>
                            <option value="Chemicals">Chemicals</option>
                        </select>
                    </div>
                    <div class="w-px h-6 bg-brand-sandDark mx-1"></div>
                    <div class="flex items-center gap-2 shrink-0 pr-2">
                        <i data-lucide="arrow-up-down" class="w-4 h-4 text-gray-400"></i>
                        <select id="sort-by" onchange="renderList()" class="bg-transparent text-sm focus:outline-none text-brand-slate font-medium cursor-pointer py-1.5">
                            <option value="name-asc">Alphabetical (A-Z)</option>
                            <option value="name-desc">Alphabetical (Z-A)</option>
                            <option value="stock-low">Stock (Low-High)</option>
                        </select>
                    </div>
                </div>

                <!-- INBOX LIST CONTAINER -->
                <div class="flex-1 bg-brand-paper border border-brand-sandDark rounded shadow-ledger overflow-hidden flex flex-col">
                    <div class="overflow-y-auto custom-scrollbar flex-1 relative p-2" id="inbox-container">
                        <!-- Rendered by JS -->
                    </div>
                </div>
                
            </div>
        </div>
    </main>

    <!-- SIDE DRAWER (BIODATA) -->
    <div id="drawer-backdrop" class="fixed inset-0 bg-slate-900/20 backdrop-blur-[1px] z-30 hidden opacity-0 transition-opacity" onclick="closeDrawer()"></div>
    <div id="side-drawer" class="fixed top-0 right-0 bottom-0 w-[500px] bg-brand-paper shadow-2xl z-40 translate-x-full flex flex-col border-l border-brand-sandDark">
        <div class="p-6 border-b border-brand-sandDark bg-[#FAFAF8] flex items-start justify-between shrink-0">
            <div>
                <span id="drawer-group" class="px-2 py-0.5 rounded text-[10px] font-bold tracking-wider bg-white text-gray-600 border border-brand-sandDark uppercase mb-2 inline-block">Group</span>
                <button onclick="editItemDetails('group')" class="ml-1 text-gray-400 hover:text-brand-forest transition inline-block"><i data-lucide="pencil" class="w-3 h-3"></i></button>
                
                <div class="flex items-center gap-2 mt-1">
                    <h2 id="drawer-title" class="text-xl font-bold text-brand-slate tracking-tight leading-tight">Name</h2>
                    <button onclick="editItemDetails('name')" class="text-gray-400 hover:text-brand-forest transition"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                </div>
                <p id="drawer-subtitle" class="text-sm font-medium text-gray-500 mt-1">Spec</p>
                <input type="hidden" id="drawer-item-id">
            </div>
            <button onclick="closeDrawer()" class="p-1.5 text-gray-400 hover:bg-brand-sand rounded transition"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar" id="drawer-content">
            <!-- Injected via JS -->
        </div>

        <div class="p-4 border-t border-brand-sandDark bg-[#FAFAF8] flex gap-3 shrink-0">
            <button id="drawer-btn-in" class="flex-1 py-2.5 bg-brand-forest text-white rounded text-sm font-medium hover:bg-brand-forestLight transition">Stock In</button>
            <button id="drawer-btn-out" class="flex-1 py-2.5 bg-white border border-brand-forest text-brand-forest rounded text-sm font-medium hover:bg-brand-sand transition">Stock Out</button>
        </div>
    </div>

    <script src="assets/js/layout.js"></script>
    <script src="assets/js/forms.js"></script>
    <script src="assets/js/db.js"></script>
    <script>
        // --- 1. STATE MANAGEMENT (Wired to Global DB) ---
let inventoryState = db.read('inventory');
let currentView = 'flat';

// --- 2. INBOX LIST RENDERING ---
window.toggleView = function(view) {
    currentView = view;
    // Updated active/inactive string literals to match Forest/Sand palette
    document.getElementById('btn-flat').className = view === 'flat' ? 'px-4 py-1.5 text-sm font-bold rounded bg-brand-forestLight/20 text-brand-forest transition-all' : 'px-4 py-1.5 text-sm font-medium rounded text-gray-500 hover:text-brand-forest transition-all';
    document.getElementById('btn-group').className = view === 'group' ? 'px-4 py-1.5 text-sm font-bold rounded bg-brand-forestLight/20 text-brand-forest transition-all' : 'px-4 py-1.5 text-sm font-medium rounded text-gray-500 hover:text-brand-forest transition-all';
    renderList();
};

window.createInboxRow = function(item) {
    // Mapped status colors to semantic palette
    let statusColor = 'bg-brand-forest';
    let statusText = 'text-brand-forest';
    
    if (item.totalBaseUnits === 0) { 
        statusColor = 'bg-brand-terracotta'; 
        statusText = 'text-brand-terracotta'; 
    } 
    else if (item.totalBaseUnits <= item.minThreshold) { 
        statusColor = 'bg-orange-500'; 
        statusText = 'text-orange-600'; 
    }

    let displaySpecies = item.targetSpecies.split(' ')[0];

    return `
        <div class="group flex items-center justify-between p-4 mb-2 bg-brand-paper hover:bg-brand-sand border border-brand-sandDark rounded transition cursor-pointer shadow-ledger relative" onclick="openDrawer('${item.id}')">
            <div class="flex-1">
                <div class="flex items-center gap-2 mb-1">
                    <h3 class="text-lg font-bold text-brand-slate leading-tight group-hover:text-brand-forestLight transition">${item.name}</h3>
                    <span class="px-2 py-0.5 rounded text-[10px] font-bold tracking-wider bg-gray-100 text-gray-600 uppercase border border-gray-200">${item.category}</span>
                    ${item.isControlled === 'Yes' ? `<span class="px-2 py-0.5 rounded text-[10px] font-bold tracking-wider bg-brand-terracotta/10 text-brand-terracotta uppercase border border-brand-terracotta/20">Controlled</span>` : ''}
                </div>
                <div class="flex items-center gap-3 text-sm text-gray-500">
                    <span class="font-medium text-gray-600">${item.brand} ${item.generatedName ? '- ' + item.generatedName : ''}</span>
                    <span class="w-1 h-1 rounded-full bg-brand-sandDark"></span>
                    <span class="flex items-center gap-1 text-gray-400"><i data-lucide="paw-print" class="w-3 h-3"></i> ${displaySpecies}</span>
                </div>
            </div>
            
            <div class="w-48 px-6 flex flex-col items-end border-r border-brand-sandDark transition-opacity group-hover:opacity-10">
                <div class="flex items-baseline gap-1 font-mono">
                    <span class="text-2xl font-bold ${statusText}">${item.totalBaseUnits.toLocaleString()}</span>
                    <span class="text-sm font-medium text-gray-500">${item.baseUnit}</span>
                </div>
                <div class="flex items-center gap-1.5 mt-0.5">
                    <div class="w-2 h-2 rounded-full ${statusColor}"></div>
                    <span class="text-[10px] font-bold uppercase tracking-wider ${statusText}">${item.totalBaseUnits <= item.minThreshold ? (item.totalBaseUnits === 0 ? 'Zero Stock' : 'Low Stock') : 'Optimal'}</span>
                </div>
            </div>

            <div class="absolute right-6 top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-100 transition-opacity flex gap-2">
                <button onclick="event.stopPropagation(); window.openModal('in', '${item.id}')" class="px-3 py-1.5 bg-brand-forest text-white rounded text-xs font-medium hover:bg-brand-forestLight transition shadow-ledger">Stock In</button>
                <button onclick="event.stopPropagation(); window.openModal('out', '${item.id}')" class="px-3 py-1.5 bg-white text-brand-forest border border-brand-forest rounded text-xs font-medium hover:bg-brand-sand transition">Stock Out</button>
            </div>
        </div>
    `;
};

window.renderList = function() {
    inventoryState = db.read('inventory'); // Always get fresh data from global DB
    const container = document.getElementById('inbox-container');
    container.innerHTML = '';
    
    let filtered = [...inventoryState];
    const filterCat = document.getElementById('filter-category').value;
    if (filterCat !== 'All') filtered = filtered.filter(i => i.category === filterCat);
    
    const search = document.getElementById('search-input').value.toLowerCase().trim();
    if (search) {
        filtered = filtered.filter(i => 
            i.name.toLowerCase().includes(search) || 
            (i.generatedName && i.generatedName.toLowerCase().includes(search)) ||
            i.brand.toLowerCase().includes(search)
        );
    }

    const sortBy = document.getElementById('sort-by').value;
    filtered.sort((a, b) => {
        if (sortBy === 'name-asc') return a.name.localeCompare(b.name);
        if (sortBy === 'name-desc') return b.name.localeCompare(a.name);
        if (sortBy === 'stock-low') return a.totalBaseUnits - b.totalBaseUnits;
        return 0;
    });

    if (filtered.length === 0) {
        container.innerHTML = `<div class="p-12 text-center text-gray-400 font-medium">No items match your criteria.</div>`;
        return;
    }

    if (currentView === 'flat') {
        filtered.forEach(item => container.innerHTML += createInboxRow(item));
    } else {
        const groups = [...new Set(filtered.map(i => i.itemGroup || 'Uncategorized'))].sort();
        groups.forEach(group => {
            const itemsInGroup = filtered.filter(i => (i.itemGroup || 'Uncategorized') === group);
            if(itemsInGroup.length > 0) {
                // Applied new grouped header formatting
                container.innerHTML += `
                    <div class="sticky-header bg-[#FAFAF8] p-3 mt-4 mb-2 border-b-2 border-brand-sandDark rounded-t">
                        <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider flex items-center gap-2">
                            <i data-lucide="folder-open" class="w-4 h-4 text-brand-forest"></i> ${group}
                            <span class="ml-auto text-xs font-bold text-gray-500 bg-white border border-brand-sandDark px-2 py-0.5 rounded">${itemsInGroup.length} Items</span>
                        </h2>
                    </div>
                `;
                itemsInGroup.forEach(item => container.innerHTML += createInboxRow(item));
            }
        });
    }
    lucide.createIcons();
};

// --- 3. DRAWER LOGIC ---
window.editItemDetails = function(field) {
    const id = document.getElementById('drawer-item-id').value;
    const item = inventoryState.find(i => i.id === id);
    if(!item) return;

    if (field === 'name') {
        const newName = prompt("Edit Commodity Name:", item.name);
        if(newName && newName.trim() !== '') {
            item.name = newName.trim();
            document.getElementById('drawer-title').textContent = item.name;
            db.write('inventory', inventoryState);
        }
    } else if (field === 'group') {
        const newGroup = prompt("Edit Item Group (Classification):", item.itemGroup);
        if(newGroup !== null) { 
            item.itemGroup = newGroup.trim() || 'Uncategorized';
            document.getElementById('drawer-group').textContent = item.itemGroup;
            db.write('inventory', inventoryState);
        }
    }
    renderList();
};

window.openDrawer = function(itemId) {
    const item = inventoryState.find(i => i.id === itemId);
    if(!item) return;

    document.getElementById('drawer-item-id').value = item.id;
    document.getElementById('drawer-group').textContent = item.itemGroup || 'Uncategorized';
    document.getElementById('drawer-title').textContent = item.name;
    document.getElementById('drawer-subtitle').textContent = `${item.brand} - ${item.generatedName || 'N/A'}`;

    let displayCount = `${item.totalBaseUnits.toLocaleString()} ${item.baseUnit}`;
    let displayBulk = "";
    if (item.latestMultiplier > 1) {
        const bulk = Math.floor(item.totalBaseUnits / item.latestMultiplier);
        const rem = item.totalBaseUnits % item.latestMultiplier;
        displayBulk = `(Est: ${bulk} ${item.latestPurchasingUnit}` + (rem > 0 ? ` + ${rem} ${item.baseUnit})` : ')');
    }

    // Applied new ledger dossier styling to template literal
    document.getElementById('drawer-content').innerHTML = `
        <div class="bg-[#FAFAF8] border border-brand-sandDark rounded p-5 flex items-center justify-between">
            <div>
                <p class="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1">Total Stock on Hand</p>
                <p class="text-2xl font-bold text-brand-slate font-mono">${displayCount}</p>
                ${displayBulk ? `<p class="text-xs font-medium text-gray-500 mt-0.5">${displayBulk}</p>` : ''}
            </div>
            <div class="text-right">
                <p class="text-[10px] text-gray-500 uppercase tracking-wider">Alert Threshold</p>
                <p class="text-sm font-bold text-orange-600 font-mono">${item.minThreshold} ${item.baseUnit}</p>
            </div>
        </div>

        <div>
            <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider border-b-2 border-brand-sandDark pb-2 mb-4">Master Identity & Protocol</h3>
            <div class="grid grid-cols-2 gap-y-4 gap-x-4">
                <div><p class="text-[10px] text-gray-500 uppercase tracking-wider">Target Species</p><p class="text-sm font-medium text-brand-slate">${item.targetSpecies}</p></div>
                <div><p class="text-[10px] text-gray-500 uppercase tracking-wider">Storage Protocol</p><p class="text-sm font-medium text-brand-slate">${item.storage}</p></div>
            </div>
            
            <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider border-b-2 border-brand-sandDark pb-2 mt-6 mb-4">Latest Batch Info</h3>
            <div class="grid grid-cols-2 gap-y-4 gap-x-4">
                <div><p class="text-[10px] text-gray-500 uppercase tracking-wider">Packaging Configuration</p><p class="text-sm font-medium text-brand-slate">1 ${item.latestPurchasingUnit} = ${item.latestMultiplier} ${item.baseUnit}</p></div>
                <div><p class="text-[10px] text-gray-500 uppercase tracking-wider">Physical Location</p><p class="text-sm font-medium text-brand-slate">${item.latestLocation || 'Unassigned'}</p></div>
                
                <div class="col-span-2 border-t border-brand-sandDark pt-3 mt-1">
                    <p class="text-[10px] text-gray-500 uppercase tracking-wider mb-1">Procurement Financials</p>
                    <div class="bg-[#FAFAF8] p-3 rounded border border-brand-sandDark flex justify-between">
                        <div><p class="text-xs text-gray-500 font-medium">${item.procurement}</p></div>
                        <div><p class="text-sm font-bold text-brand-slate font-mono">${item.costInfo || 'N/A'}</p></div>
                    </div>
                </div>

                <div class="col-span-2 border-t border-brand-sandDark pt-3 mt-1 grid grid-cols-2 gap-4">
                    <div><p class="text-[10px] text-gray-500 uppercase tracking-wider">Expiration Date</p><p class="text-sm font-mono font-medium ${item.expiry ? 'text-brand-terracotta' : 'text-gray-400'}">${item.expiry || 'Not Applicable'}</p></div>
                    <div><p class="text-[10px] text-gray-500 uppercase tracking-wider">Batch / Lot ID</p><p class="text-sm font-bold font-mono text-brand-slate">${item.batchId || 'N/A'}</p></div>
                </div>
            </div>
        </div>
        ${item.isControlled === 'Yes' ? `
        <div class="mt-2 p-4 bg-brand-terracotta/10 border border-brand-terracotta/20 rounded flex gap-3">
            <i data-lucide="shield-alert" class="w-5 h-5 text-brand-terracotta shrink-0"></i>
            <div>
                <p class="text-sm font-bold text-brand-terracotta">Controlled Substance</p>
                <p class="text-xs text-brand-terracotta/80 mt-1 font-medium">Requires authorized personnel auditing.</p>
            </div>
        </div>` : ''}
    `;
    lucide.createIcons();

    document.getElementById('drawer-btn-in').onclick = () => { closeDrawer(); window.openModal('in', item.id); };
    document.getElementById('drawer-btn-out').onclick = () => { closeDrawer(); window.openModal('out', item.id); };

    document.getElementById('drawer-backdrop').classList.remove('hidden');
    setTimeout(() => {
        document.getElementById('drawer-backdrop').classList.replace('opacity-0', 'opacity-100');
        document.getElementById('side-drawer').classList.add('drawer-open');
    }, 10);
};

window.closeDrawer = function() {
    document.getElementById('side-drawer').classList.remove('drawer-open');
    document.getElementById('drawer-backdrop').classList.replace('opacity-100', 'opacity-0');
    setTimeout(() => document.getElementById('drawer-backdrop').classList.add('hidden'), 300);
};

// INIT
renderList();
    </script>
</body>
</html>
